<header class="cabecera">
  <a class="marca" routerLink="/">
    <img src="logo.png" alt="" width="34" height="41" />
    <span>{{ estudio }}</span>
  </a>
  <nav aria-label="Principal">
    <a routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <a routerLink="/acerca" routerLinkActive="activo">Acerca de</a>
  </nav>
</header>

<main>
  <router-outlet />
</main>

<footer class="pie">
  <img src="logo.png" alt="Logo de {{ estudio }}" width="26" height="32" />
  <p>{{ estudio }}, {{ anio }}</p>
  <a [href]="'mailto:' + email">{{ email }}</a>
</footer>
