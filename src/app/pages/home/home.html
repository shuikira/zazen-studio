<section class="escena">
  <div class="ondas" aria-hidden="true"><span></span><span></span><span></span></div>

  <img class="daruma" src="logo.png" alt="Daruma, logo de {{ estudio }}" />
  <h1>{{ juego.nombre }}</h1>
  <p class="logline">{{ juego.logline }}</p>

  <button class="bajar" type="button" (click)="bajar()">Escucha</button>
</section>

<section class="historia" id="historia">
  @for (f of frases; track f; let i = $index) {
    <p reveal [style.--d]="i * 0.6 + 's'">{{ f }}</p>
  }

  <div class="final" reveal style="--d: 1.8s">
    <p>{{ juego.generos }}. Un juego para jugar en calma.</p>
    <a class="boton" routerLink="/acerca">Conoce el estudio</a>
  </div>
</section>
